                        role="tab"

                    <div class="mb-3">

                    <div class="mb-3">

                                    v-model="code"
                            />

                                    class="btn btn-outline-secondary"

    <div
            ref="error-toast"
            class="toast align-items-center text-bg-danger border-0"
            role="alert"
            aria-live="assertive"
            aria-atomic="true"
    >
        <div class="d-flex">

                    data-bs-dismiss="toast"

        src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"
></script>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"
></script>
<script>
    const modelAttributes = {
        exception: "[[${exception}]]"
    }
</script>
<script type="module">
    import {
        createApp,
        ref,
        useTemplateRef,
    } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";

    createApp({
        setup() {
            const captchaImg = useTemplateRef("captcha-img");
            const errorToast = useTemplateRef("error-toast");

            const code = ref("");
            const sendVerificationCodeBtnText = ref("发送验证码");
            const sendVerificationCodeBtnDisabled = ref(false);
            const countDown = ref(60);

            const errorMsg = ref("登录出错!");

            const getCode = () => {
                sendVerificationCodeBtnDisabled.value = true;

                fetch(
                    "https://www.aprillie.com/driftwood-cloud/admin/auth/code?phone=18752065699",
                    {
                        method: "POST"
                    }
                )
                    .then((response) => response.json())
                    .then((data) => {
                        console.log(data)
                        code.value = data.data;
                    })
                    .catch((error) => {
                        errorMsg.value = error.message;
                        new bootstrap.Toast(errorToast.value).show();
                    });

                let timer = setInterval(() => {
                    countDown.value--;
                    sendVerificationCodeBtnText.value = `${countDown.value}秒后重试`;
                    if (countDown.value <= 0) {
                        clearInterval(timer);
                        sendVerificationCodeBtnText.value =
                            "发送验证码";
                        countDown.value = 10;
                        sendVerificationCodeBtnDisabled.value = false;
                    }
                }, 1000);
            };

            const getCaptcha = () => {
                fetch(
                    "https://www.aprillie.com/driftwood-cloud/admin/auth/captcha"
                )
                    .then((response) => response.json())
                    .then((data) => {
                        captchaImg.value.src =
                            "data:image/jpeg;base64," + data.data;
                    })
                    .catch((error) => {
                        errorMsg.value = error.message;
                        new bootstrap.Toast(errorToast.value).show();
                    });
            };
            return {
                sendVerificationCodeBtnText,
                getCode,
                sendVerificationCodeBtnDisabled,
                errorToast,
                captchaImg,
                getCaptcha,
                errorMsg,
                code
            };
        },

        mounted() {
            this.getCaptcha();
            if (window.location.search && window.location.search !== "") {
                if (window.location.search.includes("error")) {
                    this.errorMsg = "无效的用户名或者密码"
                    new bootstrap.Toast(this.errorToast).show();
                }
                if (window.location.search.includes("logout")) {
                    this.errorMsg = "用户已经注销登录"
                    new bootstrap.Toast(this.errorToast).show();
                }
            }
            if (modelAttributes.exception && modelAttributes.exception !== "") {
                this.errorMsg = modelAttributes.exception
                new bootstrap.Toast(this.errorToast).show();
            }
        },
    }).mount("#app");
</script>
</body>
</html>
