<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Driftwood Web</title>

        <script src="//at.alicdn.com/t/font_3327625_siao2mp0kcb.js"></script>

        <style>
            html {
                box-sizing: border-box;
            }

            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: inherit;
            }

            @property --x {
                syntax: "<length>";
                initial-value: 0px;
                inherits: false;
            }

            @property --y {
                syntax: "<length>";
                initial-value: 0px;
                inherits: false;
            }

            .loading-wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
            }

            .loading-circle {
                width: 24px;
                height: 24px;
                background-color: dodgerblue;
                border-radius: 50%;

                transform: translate(var(--x), var(--y));
                animation:
                    x 4s,
                    y 2s;
                animation-timing-function: cubic-bezier(0.5, -800, 0.5, 800);
                animation-iteration-count: infinite;
            }

            @keyframes x {
                to {
                    --x: 1px;
                }
            }

            @keyframes y {
                to {
                    --y: 0.1px;
                }
            }

            .loading-trail-wrapper {
                position: absolute;
                width: 100%;
                height: 100%;
            }

            .loading-trail {
                fill: none;
                stroke: #292b2b;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-dasharray: 5, 5;
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div id="loading-wrapper" class="loading-wrapper">
                <div id="loading-circle" class="loading-circle"></div>
                <svg class="loading-trail-wrapper">
                    <path
                        id="loading-trail"
                        class="loading-trail"
                        d="M 100 100"
                    />
                </svg>
            </div>
        </div>
        <script>
            const loadingWrapper = document.getElementById("loading-wrapper");
            const loadingCircle = document.getElementById("loading-circle");
            const loadingTrail = document.getElementById("loading-trail");

            const centerX = loadingWrapper.clientWidth / 2;
            const centerY = loadingWrapper.clientHeight / 2;

            // 初始化路径
            let d = `M ${centerX} ${centerY}`;

            let animationFrameId;
            // 每帧更新路径
            function updateTrail() {
                const x =
                    parseFloat(
                        getComputedStyle(loadingCircle).getPropertyValue("--x")
                    ) + centerX;
                const y =
                    parseFloat(
                        getComputedStyle(loadingCircle).getPropertyValue("--y")
                    ) + centerY;

                d += ` L ${x} ${y}`;
                loadingTrail.setAttribute("d", d);

                animationFrameId = requestAnimationFrame(updateTrail);
            }
            // 启动轨迹更新
            updateTrail();

            // 使用 MutationObserver 监听元素是否被移除
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.removedNodes.length > 0) {
                        mutation.removedNodes.forEach((node) => {
                            if (
                                node &&
                                node.classList &&
                                node.classList.contains("loading-wrapper")
                            ) {
                                cancelAnimationFrame(animationFrameId);
                                observer.disconnect();
                            }
                        });
                    }
                });
            });

            // 监听整个文档的子节点变化
            observer.observe(document.body, { childList: true, subtree: true });
        </script>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
